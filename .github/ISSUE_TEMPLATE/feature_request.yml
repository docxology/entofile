name: Feature request
description: Propose a bounded ENTO improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What operator, reader, or implementer problem does this solve?
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - "documentation"
        - "Python 3.15 CLI or SDK"
        - "ENTO 0.5.0 conformance"
        - "benchmark or visualization"
        - "security review"
        - "research outside the current wire format"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the change and how it preserves the Python 3.15 and ENTO 0.5.0-only contract, or identify it as separate research.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: What tests, fixtures, docs, or render gates should prove it?
